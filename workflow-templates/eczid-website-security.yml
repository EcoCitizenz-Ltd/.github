name: ECZ-ID Website Security

on:
  workflow_dispatch:
    inputs:
      website:
        description: Public website URL or hostname to observe
        required: false
        type: string
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  website-security:
    name: Current public website evidence
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target website
        id: target
        shell: bash
        env:
          INPUT_WEBSITE: ${{ inputs.website }}
          DEFAULT_WEBSITE: ${{ vars.ECZID_WEBSITE_URL }}
        run: |
          set -euo pipefail
          target="${INPUT_WEBSITE:-${DEFAULT_WEBSITE:-}}"
          if [ -z "$target" ]; then
            echo "Set repository variable ECZID_WEBSITE_URL or supply the workflow_dispatch website input." >&2
            exit 2
          fi
          echo "website=$target" >> "$GITHUB_OUTPUT"

      - name: ECZ-ID Website Security
        uses: EcoCitizenz-Ltd/eczid-website-security@v1
        with:
          website: ${{ steps.target.outputs.website }}
